name: Verificar Docker y API
on:
  push:
    branches: [main, chore/docker-local, feat/postgresql-supabase, feat/render-gmail]
  pull_request:
permissions:
  contents: read
jobs:
  docker:
    runs-on: ubuntu-latest
    env:
      DB_PASSWORD: ci-disposable-user-password
      MYSQL_ROOT_PASSWORD: ci-disposable-root-password
      JWT_SECRET: ZG9ja2VyLWNpLW9ubHktc2VjcmV0LW5vdC1mb3ItcHJvZHVjdGlvbg==
      ADMIN_EMAIL: admin@example.com
      ADMIN_PASSWORD: CI-admin-test-only-2026!
      TEST_EMAIL: smoke@example.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Compilar y probar Java
        run: mvn --batch-mode --no-transfer-progress clean install -U dependency:copy-dependencies
      - name: Iniciar MySQL y API en Docker
        run: docker compose up --build -d --wait
      - name: Preparar administrador del contenedor
        env:
          DB_URL: jdbc:mysql://127.0.0.1:3307/crud_usuarios?sslMode=DISABLED&serverTimezone=UTC&allowPublicKeyRetrieval=true
          DB_USERNAME: users_app
        run: java --class-path 'target/dependency/*' tools/DatabaseTasks.java bootstrap
      - name: Registro, activacion, login y JWT
        shell: pwsh
        run: ./tools/Smoke.ps1
      - name: Logs de Docker
        if: always()
        run: docker compose logs --no-color --tail=30
      - name: Cerrar contenedores temporales
        if: always()
        run: docker compose down
